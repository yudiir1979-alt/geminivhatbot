<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 400px;
            height: 600px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #4A90E2;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 75%;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }
        .user-message {
            background: #DCF8C6;
            align-self: flex-end;
        }
        .bot-message {
            background: #E1E1E1;
            align-self: flex-start;
        }
        .chat-input {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            background: #fff;
        }
        .chat-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }
        .chat-input button {
            background: #4A90E2;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-left: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .chat-input button:hover {
            background: #357ABD;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Gemini Chatbot-YudiIrawan</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">Halo! Ada yang bisa saya bantu hari ini?</div>
    </div>
    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Ketik pesan..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Kirim</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const messageText = inputField.value.trim();
        if (!messageText) return;

        const chatMessages = document.getElementById('chatMessages');

        // Tampilkan pesan user
        const userDiv = document.createElement('div');
        userDiv.className = 'message user-message';
        userDiv.textContent = messageText;
        chatMessages.appendChild(userDiv);

        inputField.value = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // Kirim ke backend Express
        try {
            const response = await fetch('http://localhost:3000/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: messageText })
            });

            const data = await response.json();

            // Tampilkan balasan bot
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            botDiv.textContent = data.reply || 'Maaf, terjadi kesalahan.';
            chatMessages.appendChild(botDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

        } catch (error) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'message bot-message';
            errorDiv.textContent = 'Gagal terhubung ke server.';
            chatMessages.appendChild(errorDiv);
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
